[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "research-paper-graphviz"
description = "Paperimation.ai — narrated research-paper animations using Manim and AI"
maintainers = [{name = "Sagi Siddhartha"}]
authors = [
    {name = "Sagi Siddhartha ", email = "sagi15sid05@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["research", "visualization", "manim", "pdf-parsing", "animation", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]
dynamic = ["dependencies", "version"]

[project.urls]
homepage = "https://github.com/space-rock-0/Paperimation"
repository = "https://github.com/space-rock-0/Paperimation"

[tool.hatch.version]
path = "src/research_viz/__init__.py"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_viz"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
filterwarnings = [
    'ignore::UserWarning',
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
